{% load static %}

<div class="col-lg-4">
    <div class="sidebar">
        <div class="row">

            <!-- Search -->
            <div class="col-lg-12">
                <div class="sidebar-item search">
                    <form id="search_form" name="gs" method="GET" action="{% url 'chronicle:search' %}">
                        <input type="text"
                               name="search"
                               class="searchText"
                               placeholder="type to search..."
                               autocomplete="on">
                    </form>
                </div>
            </div>

            <!-- Recent Posts -->
            <div class="col-lg-12">
                <div class="sidebar-item recent-posts">
                    <div class="sidebar-heading">
                        <h2>Recent Posts</h2>
                    </div>

                    <div class="content">
                        <ul>
                            {% for item in recent_posts %}
                                <li>
                                    <a href="{{ item.get_absolute_url }}">
                                        <h5>{{ item.title }}</h5>
                                        <span>{{ item.created_at }}</span>
                                    </a>
                                </li>
                            {% empty %}
                                <li>هیچ پستی وجود ندارد.</li>
                            {% endfor %}
                        </ul>
                    </div>

                </div>
            </div>

            <!-- Categories -->
            <div class="col-lg-12">
                <div class="sidebar-item categories">
                    <div class="sidebar-heading">
                        <h2>Categories</h2>
                    </div>

                    <div class="content">
                        <ul>
                          {% for item in recent_categories %}
                                <li><a href="{% url "chronicle:category" item.id %}">{{ item.name }}</a></li>
                            {% endfor %}

                        </ul>
                    </div>

                </div>
            </div>



        </div>
    </div>
</div>
